name: Publish create-airgap-bot

on:
  push:
    tags:
      - 'create-airgap-bot-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/create-airgap-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.11'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: ../..

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Test packed offline scaffold
        run: npm run cli:pack:test
        working-directory: ../..

      - name: Conflict check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The gh CLI is preinstalled on ubuntu-latest. Conflict-check exits
          # non-zero if the npm name or repo namespace is already taken.
          npm run conflict-check

      - name: Dry-run publish
        run: npm publish --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
