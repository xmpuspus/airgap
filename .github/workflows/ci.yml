name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.11
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run docs:check
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand --coverage
      - run: npm run journeys
      - run: npm run kb:validate
      - run: npm run server:test
      - run: npm run signing:test
      - run: npm run providers:validate
      - run: npm run cli:pack:test
      - run: npm run security:direct
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm run recordings:validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.11
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - run: ./gradlew testDebugUnitTest --tests '*ProviderHarnessTest'
        working-directory: android
      - run: ./gradlew assembleDebug
        working-directory: android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.11
          cache: npm
      - run: npm ci
      - run: bundle install
      - run: npm run providers:swift:test
      - run: bundle exec pod install
        working-directory: ios
      - run: >-
          xcodebuild -workspace ios/Airgap.xcworkspace -scheme Airgap
          -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
