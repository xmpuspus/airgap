name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.11
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand --coverage
      - run: npm run journeys
      - run: npm run kb:validate
      - run: npm run server:test
      - run: npm run signing:test
      - run: npm run cli:pack:test
      - run: npm run security:direct
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm run recordings:validate
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.11
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - run: ./gradlew assembleDebug
        working-directory: android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.11
          cache: npm
      - run: npm ci
      - run: bundle install
      - run: bundle exec pod install
        working-directory: ios
      - run: >-
          xcodebuild -workspace ios/Airgap.xcworkspace -scheme Airgap
          -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
