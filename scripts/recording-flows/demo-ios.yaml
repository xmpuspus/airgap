appId: ${APP_ID}
name: Airgap iOS release recording
---
- launchApp:
    clearState: true
    clearKeychain: true
- scrollUntilVisible:
    element: 'AI FOR THIS DEVICE'
    direction: DOWN
    speed: 30
    visibilityPercentage: 80
- startRecording:
    path: ${RECORDING_PATH}
- takeScreenshot: ${SHOT_PREFIX}-provider-readiness
- scrollUntilVisible:
    element:
      text: 'Try Offline Demo'
      index: 1
    direction: DOWN
    speed: 35
    visibilityPercentage: 80
- takeScreenshot: ${SHOT_PREFIX}-onboarding
- tapOn:
    text: 'Try Offline Demo'
    index: 1
    retryTapIfNoChange: true
- assertVisible: 'DEMO'
- takeScreenshot: ${SHOT_PREFIX}-chat
- tapOn: 'Check plans'
- extendedWaitUntil:
    visible: 'Document answer'
    timeout: 30000
- takeScreenshot: ${SHOT_PREFIX}-answer-source
- swipe:
    direction: UP
    duration: 400
- takeScreenshot: ${SHOT_PREFIX}-answer-provenance
- waitForAnimationToEnd
- stopRecording
