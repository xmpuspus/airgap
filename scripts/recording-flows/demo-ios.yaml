appId: ${APP_ID}
name: Airgap iOS release recording
---
- launchApp:
    clearState: true
    clearKeychain: true
- scrollUntilVisible:
    element:
      text: 'Try Offline Demo'
      index: 1
    direction: DOWN
    speed: 35
    visibilityPercentage: 80
- startRecording:
    path: ${RECORDING_PATH}
- takeScreenshot: ${SHOT_PREFIX}-onboarding
- tapOn:
    text: 'Try Offline Demo'
    index: 1
    retryTapIfNoChange: true
- assertVisible: 'DEMO'
- takeScreenshot: ${SHOT_PREFIX}-chat
- tapOn: 'Check plans'
- extendedWaitUntil:
    visible: 'On-device model'
    timeout: 30000
- takeScreenshot: ${SHOT_PREFIX}-answer-source
- tapOn: 'Open Outbox'
- assertVisible: 'Outbox is clear'
- takeScreenshot: ${SHOT_PREFIX}-outbox
- back
- tapOn: 'Open settings'
- scrollUntilVisible:
    element: 'Delete All My Data'
    direction: DOWN
    speed: 30
    visibilityPercentage: 90
- takeScreenshot: ${SHOT_PREFIX}-privacy
- stopRecording
