appId: ${APP_ID}
name: Airgap Android release recording
---
- setAirplaneMode: disabled
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: 'AI FOR THIS DEVICE'
    direction: DOWN
    speed: 30
    visibilityPercentage: 80
- startRecording:
    path: ${RECORDING_PATH}
- takeScreenshot: ${SHOT_PREFIX}-provider-readiness
- scrollUntilVisible:
    element:
      text: 'Try Offline Demo'
      index: 1
    direction: DOWN
    speed: 35
    visibilityPercentage: 80
- takeScreenshot: ${SHOT_PREFIX}-onboarding
- tapOn:
    text: 'Try Offline Demo'
    index: 1
    retryTapIfNoChange: true
- assertVisible: 'DEMO'
- takeScreenshot: ${SHOT_PREFIX}-chat
- tapOn: 'Check plans'
- extendedWaitUntil:
    visible: 'Document answer'
    timeout: 30000
- takeScreenshot: ${SHOT_PREFIX}-answer-source
- setAirplaneMode: enabled
- waitForAnimationToEnd
- tapOn:
    id: 'com.airgap:id/dismiss_button'
    optional: true
- tapOn:
    point: '93%,92%'
    optional: true
- extendedWaitUntil:
    notVisible: 'Open debugger to view warnings\.'
    timeout: 10000
- tapOn: 'Support question'
- inputText: 'Create a ticket'
- hideKeyboard
- tapOn: 'Send message'
- extendedWaitUntil:
    visible: 'Queued'
    timeout: 20000
- takeScreenshot: ${SHOT_PREFIX}-action-receipt
- tapOn:
    point: '80%,10%'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Outbox'
    timeout: 10000
- assertVisible: 'Pending'
- takeScreenshot: ${SHOT_PREFIX}-outbox
- back
- tapOn:
    text: 'Open settings'
    retryTapIfNoChange: true
- takeScreenshot: ${SHOT_PREFIX}-provider-settings
- scrollUntilVisible:
    element: 'Delete All My Data'
    direction: DOWN
    speed: 30
    visibilityPercentage: 90
- takeScreenshot: ${SHOT_PREFIX}-privacy
- stopRecording
- setAirplaneMode: disabled
