appId: ${APP_ID}
name: Airgap industry template recording
---
- setAirplaneMode: disabled
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      text: 'Try Offline Demo'
      index: 1
    direction: DOWN
    speed: 35
    visibilityPercentage: 80
    timeout: 40000
- startRecording:
    path: ${RECORDING_PATH}
- takeScreenshot: ${SHOT_PREFIX}-onboarding
- tapOn:
    text: 'Try Offline Demo'
    index: 1
    retryTapIfNoChange: true
- assertVisible: 'DEMO'
- tapOn: ${QUICK_REPLY}
- extendedWaitUntil:
    visible: 'Document answer'
    timeout: 90000
- takeScreenshot: ${SHOT_PREFIX}-answer-source
# Android screen recording writes a frame only on change, so a short scroll
# keeps the finished answer card in the clip.
- swipe:
    direction: DOWN
    duration: 500
- swipe:
    direction: UP
    duration: 500
- waitForAnimationToEnd
- stopRecording
